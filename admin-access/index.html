<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A2042A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:wght@400;600;700&display=swap">
<style>
  :root{--paper:#EBE6DE;--berry:#A2042A;--ink:#141010;--muted:#6F6259}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px 28px;overflow-x:hidden}
  #app,#panel,.card,label,form,.editor-top{min-width:0;max-width:100%}
  h1{font-family:'Titan One',system-ui,sans-serif;font-weight:400;letter-spacing:.02em;color:var(--berry);font-size:34px;margin:8px 0 6px;text-transform:uppercase}
  h1 span{font-family:Montserrat,sans-serif;font-weight:300;letter-spacing:0;text-transform:none;color:var(--ink);font-size:28px}
  p{line-height:1.45}
  #lock{max-width:440px;margin:0 auto}
  .card{background:#fff;border:1.5px solid var(--ink);padding:16px;display:grid;gap:10px}
  label{display:grid;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  input,select,textarea{font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--ink);width:100%;background:#fff;color:inherit}
  textarea{min-height:88px;resize:vertical}
  button,a{touch-action:manipulation}
  button{font:inherit;font-weight:700;background:var(--berry);color:#fff;border:0;padding:12px 16px;cursor:pointer}
  .err{color:var(--berry);min-height:1.2em;font-size:14px;margin:0}
  .fine{color:var(--muted);font-size:13px}
  ol{padding:0;margin:8px 0 0;list-style:none;display:grid;gap:8px}
  li{background:#fff;border:1.5px solid var(--ink);padding:10px 12px;font-size:14px}
  html.desk #lock{display:none}
  html.desk #app[hidden]{display:block}
  #app{max-width:560px;margin:0 auto}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--paper);z-index:2;padding:2px 0 8px}
  #app h1{font-size:28px;margin:0}
  .ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .tabs{display:flex;gap:6px;margin:4px 0 12px}
  .tabs[hidden]{display:none}
  .tabs button{flex:1;background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:10px 2px;font-size:11px}
  .tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
  .tools{display:grid;gap:8px;margin-bottom:10px}
  #list{display:grid;gap:8px;padding-bottom:88px}
  .row{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--ink);padding:8px}
  .row.flash{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry)}
  .open{flex:1;min-width:0;display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;font-weight:400}
  .open img,.now{width:52px;height:52px;object-fit:contain;background:#f6f1ea;flex:none}
  .open span{min-width:0}
  .name{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sub{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heart{flex:none;background:none;border:0;color:#c8b8b0;font-size:22px;line-height:1;padding:8px}
  .heart.on{color:var(--berry)}
  #plus{position:fixed;z-index:4;right:max(16px,calc(50vw - 264px));bottom:max(16px,env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:36px;line-height:1;padding:0;box-shadow:0 8px 20px rgba(162,4,42,.28)}
  .back{background:none;border:0;color:var(--ink);padding:0 0 8px;font-size:14px}
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .who button{background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:8px 10px;font-size:13px}
  .who button.on{background:var(--berry);color:#fff;border-color:var(--berry)}
  .pics{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
  .pics button{padding:0;border:2px solid transparent;background:#fff;flex:none}
  .pics button.on{border-color:var(--berry)}
  .pics img{width:72px;height:72px;object-fit:contain;display:block}
  #photoPreview{width:140px;height:140px;object-fit:contain;background:#f6f1ea;border:1.5px solid var(--ink)}
  .savebar{display:flex;gap:8px;padding-top:4px}
  .savebar button{flex:1}
  .edithead{font-family:Montserrat,sans-serif;font-weight:700;font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink);margin:0 0 12px}
  .editor-photo{margin:0 0 12px}
  .editor-photo img,.editor-top img{width:96px;height:96px;object-fit:contain;background:#f6f1ea;border:1.5px solid var(--ink)}
  .editor-top{display:flex;gap:12px;align-items:center;margin:0 0 14px}
  .editor-top img{width:64px;height:64px;flex:none}
  .fieldlabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .textlink{color:var(--berry);font-weight:700;font-size:14px}
  .check{text-transform:none;letter-spacing:0;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
  .check input{width:auto}
  .more{background:#fff;border:1.5px solid var(--ink);padding:12px}
  .more summary{font-weight:700;cursor:pointer}
  .morebody{display:grid;gap:10px;margin-top:10px}
  .openlink{display:block;text-align:center;text-decoration:none;font-weight:700;padding:12px;background:var(--berry);color:#fff;margin:0 0 12px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .kpi{background:#fff;border:1.5px solid var(--ink);padding:12px}
  .kpi b{display:block;font-family:'Titan One',system-ui,sans-serif;font-weight:400;font-size:28px;color:var(--berry)}
  .kpi span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .pills button{background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:8px 10px;font-size:13px}
  .pills button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .stat{display:flex;justify-content:space-between;gap:12px;background:#fff;border:1.5px solid var(--ink);padding:10px 12px;margin-top:8px}
  .stat b{font-size:14px;font-weight:700}
  .door{background:#fff;border:1.5px solid var(--ink);padding:10px 12px;margin-top:8px}
  .door .name{font-size:15px}
  .tag{color:var(--berry);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;font-size:14px;z-index:6;max-width:calc(100% - 32px)}
  .linkblock h2{font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);margin:18px 0 4px}
  .linkhd{margin:16px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .linkrow{display:grid;grid-template-columns:52px 1fr;gap:8px 10px;align-items:center;background:#fff;border:1.5px solid var(--ink);padding:8px;margin-top:8px}
  .linkrow.bad{box-shadow:inset 3px 0 0 var(--berry)}
  .linkrow img{width:52px;height:52px;object-fit:contain;background:#f6f1ea}
  a.linkmain{color:inherit;text-decoration:none;min-width:0}
  .linkmain{min-width:0}
  .linkacts{grid-column:1 / -1;display:flex;gap:8px}
  .linkgo,.linkedit{flex:1;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:14px;padding:10px;border:1.5px solid var(--ink)}
  .linkgo{background:var(--berry);color:#fff;border-color:var(--berry)}
  .linkedit{background:#fff;color:var(--ink)}
  .sub.url{color:var(--berry)}
</style>
<script>
try { if (+localStorage.getItem('gg26:deskUntil') > Date.now()) document.documentElement.classList.add('desk'); } catch (e) {}
</script>
</head>
<body>
<main id="lock">
  <h1><span>tay's </span>dashboard</h1>
  <p>password first. then you'll see every gift, a button to add one, and the stats.</p>
  <form class="card" id="deskForm">
    <label>name<input name="username" autocomplete="username" value="tay" aria-label="name"></label>
    <label>password<input name="password" type="password" autocomplete="current-password" required aria-label="password"></label>
    <p class="err" id="deskErr" role="status"></p>
    <button type="submit">open the dashboard</button>
  </form>
  <p class="fine">this phone stays signed in for 30 days. add this page to your home screen and the icon opens right here.</p>
  <div id="how"></div>
</main>
<div id="app" hidden>
  <div class="head">
    <h1>dashboard</h1>
    <button class="ghost" type="button" id="lockBtn">lock</button>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button type="button" data-tab="gifts" aria-selected="true">gifts</button>
    <button type="button" data-tab="links" aria-selected="false">links</button>
    <button type="button" data-tab="stats" aria-selected="false">stats</button>
    <button type="button" data-tab="advent" aria-selected="false">advent</button>
    <button type="button" data-tab="requests" aria-selected="false">requests</button>
  </div>
  <div id="panel"><p class="fine">loading gifts…</p></div>
  <button id="plus" type="button" aria-label="add a gift" hidden>+</button>
</div>
<div id="toast" hidden role="status"></div>
<script>
const DESK_HASH = '462421efb3acba669660241bba7a12524a3aa3df951002d3bae1fd83258eea45';
const SECTIONS = ['My Top Picks','Experiences','White Elephant','Stocking Stuffers','Women','Men','Littles','Home','Big Ticket','Holiday Fun','Holiday Treats','Holiday Scents'];
const WHO = [['her','her'],['him','him'],['teens','teen'],['big kids','big kid'],['little kids','little kid'],['baby','baby'],['family','the family'],['home','the home'],['host','host'],['teachers + neighbors','teachers + neighbors'],['white elephant','white elephant']];
const VIBES = [['self-care','bath, skincare + rituals'],['cozy','blankets, slippers, candles'],['wellness','tools for feeling good'],['kitchen','for the cook or baker'],['style','bags, jewelry, shoes'],['learning','building + learning'],['pretend play','dolls, play food, dress up'],['creative','art + craft'],['game night','games for the family'],['outdoors','bikes + adventures'],['little ones','rattles, lovies, bath toys'],['holiday magic','pajamas, ornaments, advent'],['treats','cocoa, chocolate, candy'],['funny','white elephant'],['stocking','small + sweet']];
const state = { raw: null, items: [], base: new Set(), broken: new Set(), doors: [], tab: 'gifts', q: '', lq: '', lview: 'all', section: '', editing: null, editKind: '', returnScroll: 0, range: 0, pics: [], photo: '', flash: '', loadErr: '' };
const WRONG_LINK = {
  p35_08: 'opens a Blackstone griddle',
  p43_07: 'opens a hammock chair',
  p28_06: 'opens a facial brush'
};
const TRACKED_HOSTS = new Set(['go.shopmy.us','amzn.to','a.co','link.amazon','collabs.shop','shrsl.com','glnk.io','bit.ly','pjtra.com','shareasale.com','just.crrnt.app','click.linksynergy.com','get.aspr.app']);
let loading = false;
let toastTimer = 0;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc = s => String(s || '').toLowerCase();
const read = (k, d) => { try { const v = localStorage.getItem('gg26:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const write = (k, v) => localStorage.setItem('gg26:' + k, JSON.stringify(v));
const https = u => { try { return new URL(u).protocol === 'https:'; } catch (e) { return false; } };
const money = n => '$' + (n % 1 ? Number(n).toFixed(2) : String(n));
const pretty = iso => { const p = String(iso || '').split('-'); const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return months[(+p[1] || 1) - 1] + ' ' + (+p[2] || ''); };

const isPhoto = u => { const s = String(u || ''); return s.startsWith('data:image/') || https(s); };
function srcOf(g){
  if (g && isPhoto(g.remote || '')) return g.remote;
  const file = String((g && (g.pic || g.id)) || '');
  if (!/^[A-Za-z0-9_.-]+$/.test(file)) return '';
  return '/img/' + file + '.webp';
}
function thumb(g){
  const src = srcOf(g);
  return src ? `<img alt="" src="${esc(src)}" onerror="this.style.visibility='hidden'">` : '<img alt="">';
}
function toast(msg){
  const el = document.getElementById('toast');
  el.hidden = false;
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2400);
}
function parseItems(html){
  const key = 'const ALL_ITEMS = ';
  const start = html.indexOf(key);
  if (start < 0) throw new Error('missing');
  let depth = 0, ins = false, esc = false;
  for (let j = start + key.length; j < html.length; j++){
    const c = html[j];
    if (ins){
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === '"') ins = false;
      continue;
    }
    if (c === '"') ins = true;
    else if (c === '[') depth++;
    else if (c === ']'){
      depth--;
      if (depth === 0) return JSON.parse(html.slice(start + key.length, j + 1));
    }
  }
  throw new Error('missing');
}
function parseBroken(html){
  const m = html.match(/const BROKEN = new Set\(\[([\s\S]*?)\]\)/);
  if (!m) return new Set();
  return new Set([...m[1].matchAll(/"([^"]+)"/g)].map(x => x[1]));
}
function hostOf(u){
  try { return new URL(u).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { return ''; }
}
function linkJob(g){
  const url = g.u || '';
  const host = hostOf(url) || 'missing link';
  if (state.broken.has(g.id)) return { host, why: "isn't opening", kind: 'broken' };
  if (WRONG_LINK[g.id]) return { host, why: WRONG_LINK[g.id], kind: 'broken' };
  if (!hostOf(url)) return { host, why: 'no shop link', kind: 'broken' };
  if (host === 'go.shopmy.us' || host.endsWith('.shopmy.us')) return null;
  if (host === 'taylor.ringana.us') return null;
  if (host.endsWith('aizome-textiles.com') && /[?&]ref=/.test(url)) return null;
  if (TRACKED_HOSTS.has(host) || host.endsWith('.n5ka.net')) return null;
  if (host.includes('amazon.') && /[?&]tag=/.test(url)) return null;
  if (/[?&](ref|rfsn|sca_ref|ssid|aff)=/i.test(url)) return null;
  return { host, why: 'needs a ShopMy link', kind: 'shopmy' };
}
function shortUrl(u){
  try {
    const url = new URL(u);
    const path = (url.pathname + url.search).replace(/\/$/, '');
    const text = url.hostname.replace(/^www\./, '') + path;
    return text.length > 48 ? text.slice(0, 46) + '…' : text;
  } catch (e) { return ''; }
}
function linkTag(job){
  if (job.why.indexOf('opens ') === 0) return 'wrong';
  if (job.why === 'no shop link') return 'missing';
  return 'broken';
}
function parseDoors(html){
  const start = html.indexOf('const ADVENT = [');
  if (start < 0) return [];
  const end = html.indexOf('\n];', start);
  const chunk = html.slice(start, end > start ? end : start + 80000);
  const doors = [];
  const re = /d:'(\d{4}-\d{2}-\d{2})'[\s\S]*?title:'((?:\\'|[^'])*)'/g;
  let m;
  while ((m = re.exec(chunk)) && doors.length < 24) doors.push({ d: m[1], title: m[2].replace(/\\'/g, "'") });
  return doors;
}
function merge(raw){
  const items = raw.map(g => ({ ...g, w: Array.isArray(g.w) ? g.w.slice() : [] }));
  const edits = read('giftEdits', {});
  for (const g of items){
    const e = edits[g.id];
    if (!e) continue;
    for (const [k, v] of Object.entries(e)){ if (v == null) delete g[k]; else g[k] = v; }
  }
  for (const g of read('giftAdds', [])){
    if (g && g.id && !items.some(x => x.id === g.id)) items.push({ ...g, w: Array.isArray(g.w) ? g.w.slice() : [] });
  }
  return items;
}
async function loadCatalog(){
  const res = await fetch('/index.html', { cache: 'no-store' });
  if (!res.ok) throw new Error('load');
  const html = await res.text();
  state.raw = parseItems(html);
  state.broken = parseBroken(html);
  state.base = new Set(state.raw.map(g => g.id));
  state.items = merge(state.raw);
  state.doors = parseDoors(html);
}
async function showDesk(){
  document.documentElement.classList.add('desk');
  document.getElementById('lock').hidden = true;
  document.getElementById('app').hidden = false;
  if (!state.raw && !loading){
    loading = true;
    try { await loadCatalog(); state.loadErr = ''; }
    catch (e) { state.loadErr = "couldn't load the gifts. check your connection and open this again."; }
    loading = false;
  }
  render();
}
function lockDesk(){
  try { localStorage.removeItem('gg26:deskUntil'); sessionStorage.removeItem('gg26:deskSecret'); } catch (e) {}
  state.editing = null;
  state.editKind = '';
  state.tab = 'gifts';
  document.documentElement.classList.remove('desk');
  document.getElementById('app').hidden = true;
  document.getElementById('lock').hidden = false;
  const pw = document.querySelector('#deskForm [name="password"]');
  if (pw) pw.value = '';
  document.getElementById('deskErr').textContent = '';
}
function shown(){
  const q = state.q.trim().toLowerCase();
  return state.items.filter(g => {
    if (state.section && g.s !== state.section) return false;
    if (!q) return true;
    return lc(g.n + ' ' + g.g + ' ' + g.s + ' ' + (g.why || '')).includes(q);
  });
}
function rowHtml(g){
  const price = g.price != null ? ' · ' + money(g.price) : '';
  const flash = state.flash === g.id ? ' flash' : '';
  return `<div class="row${flash}" ${state.flash === g.id ? 'data-flash="1"' : ''}><button type="button" class="open" data-open="${esc(g.id)}">${thumb(g)}<span><div class="name">${esc(lc(g.n))}</div><div class="sub">${esc(lc(g.s))} · ${esc(lc(g.g))}${esc(price)}</div></span></button><button type="button" class="heart${g.tn ? ' on' : ''}" data-fav="${esc(g.id)}" aria-pressed="${g.tn ? 'true' : 'false'}" aria-label="${g.tn ? 'remove favorite' : 'mark as a favorite'}">♥</button></div>`;
}
function paintList(){
  const box = document.getElementById('list');
  const count = document.getElementById('gcount');
  if (!box) { render(); return; }
  const rows = shown();
  if (count) count.textContent = rows.length === state.items.length ? rows.length + ' gifts' : rows.length + ' of ' + state.items.length;
  box.innerHTML = rows.length ? rows.map(rowHtml).join('') : '<p class="fine">no gifts match that.</p>';
  const flash = box.querySelector('[data-flash="1"]');
  if (flash) { flash.scrollIntoView({ block: 'center' }); state.flash = ''; }
}
function giftsHtml(){
  const secs = ['<option value="">all sections</option>'].concat(SECTIONS.map(s => `<option value="${esc(s)}"${s === state.section ? ' selected' : ''}>${esc(s)}</option>`)).join('');
  return `<div class="tools"><input id="q" placeholder="search gifts" aria-label="search gifts" value="${esc(state.q)}"><select id="sec" aria-label="section">${secs}</select><p class="fine" id="gcount"></p></div><div id="list"></div>`;
}
function groupsFor(sec){
  const seen = [];
  for (const g of state.items) if ((!sec || g.s === sec) && g.g && !seen.includes(g.g)) seen.push(g.g);
  return seen;
}
function editorHtml(){
  const g = state.editing === 'new' ? null : state.items.find(x => x.id === state.editing);
  if (state.editing !== 'new' && !g) return `<button type="button" class="back" data-back>back</button><p class="err">that gift isn't in the list.</p>`;
  const sec = (g && g.s) || 'Stocking Stuffers';
  const vibe = (g && g.v) || 'stocking';
  const who = new Set((g && g.w) || []);
  const fav = !!(g && g.tn);
  const groups = groupsFor(sec).map(name => `<option value="${esc(name)}"></option>`).join('');
  const secs = SECTIONS.map(s => `<option value="${esc(s)}"${s === sec ? ' selected' : ''}>${esc(s)}</option>`).join('');
  const vibes = VIBES.map(([k, label]) => `<option value="${esc(k)}"${k === vibe ? ' selected' : ''}>${esc(label)}</option>`).join('');
  const whos = WHO.map(([k, label]) => `<button type="button" data-who="${esc(k)}" class="${who.has(k) ? 'on' : ''}" aria-pressed="${who.has(k) ? 'true' : 'false'}">${esc(label)}</button>`).join('');
  const visit = g && https(g.u) ? `<a id="visitLink" class="openlink" href="${esc(g.u)}" target="_blank" rel="noopener noreferrer">open this link</a>` : '';
  const photoOpen = state.photo || state.pics.length ? ' open' : '';
  return `<button type="button" class="back" data-back>back to ${state.tab === 'links' ? 'links' : state.tab === 'requests' ? 'requests' : 'gifts'}</button>
    <h2 class="edithead">${g ? 'edit gift' : 'new gift'}</h2>
    ${g ? `<div class="editor-photo">${thumb(g)}</div>` : ''}
    ${visit}
    <form class="card" id="giftForm" autocomplete="off">
      <label>name<input id="fName" required value="${esc(g ? g.n : '')}" maxlength="160"></label>
      <label>shop link<input id="fUrl" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" required value="${esc(g ? g.u : '')}" placeholder="https://"></label>

function sinceDay(days){
  const n = new Date();
  n.setHours(0, 0, 0, 0);
  n.setDate(n.getDate() - (days - 1));
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
}
function countOf(rec, range){
  if (!range) return typeof rec === 'number' ? rec : (rec && rec.n) || 0;
  const days = rec && rec.days;
  if (!days) return 0;
  const since = sinceDay(range);
  let n = 0;
  for (const [d, c] of Object.entries(days)) if (d >= since) n += c;
  return n;
}
function tapRows(type){
  const taps = read('taps', {});
  const rows = [];
  for (const [k, v] of Object.entries(taps)){
    if (!k.startsWith(type + '|')) continue;
    const n = countOf(v, state.range);
    if (!n) continue;
    const id = k.slice(type.length + 1);
    const g = state.items.find(x => x.id === id);
    rows.push({ id, n, name: (g && g.n) || (v && v.name) || id });
  }
  rows.sort((a, b) => b.n - a.n);
  return rows;
}

function readPhoto(file){
  return new Promise((resolve, reject) => {
    const ok = file && (String(file.type || '').startsWith('image/') || /\.(png|webp|jpe?g)$/i.test(file.name || ''));
    if (!ok) { reject(new Error('png')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read'));
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let url = canvas.toDataURL('image/webp', 0.86);
        if (!url.startsWith('data:image/webp')) url = canvas.toDataURL('image/png');
        if (url.length > 900000) url = canvas.toDataURL('image/webp', 0.72);
        if (!url.startsWith('data:image/')) url = canvas.toDataURL('image/png');
        resolve(url);
      };
      img.onerror = () => reject(new Error('img'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const ua = navigator.userAgent || '';
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  how.innerHTML = ios
    ? '<ol><li>tap the share button at the bottom of Safari</li><li>scroll and tap <b>Add to Home Screen</b></li><li>tap <b>Add</b>. the icon is named Dashboard</li></ol>'
    : android
    ? '<ol><li>tap the menu in Chrome</li><li>tap <b>Add to Home screen</b> or <b>Install app</b></li><li>tap <b>Add</b></li></ol>'
    : '<p class="fine">on your phone, open this same page and use Add to Home Screen. the icon is named Dashboard.</p>';
}
document.getElementById('deskForm').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('deskErr');
  const pw = new FormData(e.target).get('password') || '';
  if (!crypto.subtle) { err.textContent = 'open this from the https link so the password can be checked.'; return; }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(pw)));
  const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  if (hex !== DESK_HASH) { err.textContent = "that password didn't work."; return; }
  try { localStorage.setItem('gg26:deskUntil', String(Date.now() + 30 * 864e5)); } catch (ex) {}
  try { sessionStorage.setItem('gg26:deskSecret', String(pw)); } catch (ex) {}
  showDesk();
};
document.getElementById('lockBtn').onclick = lockDesk;
document.getElementById('plus').onclick = () => openEditor('new', 'full');
document.getElementById('app').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; state.editing = null; state.editKind = ''; render(); return; }
  const range = e.target.closest('[data-range]');
  if (range) { state.range = +range.dataset.range; render(); return; }
  const lview = e.target.closest('[data-lview]');
  if (lview) { state.lview = lview.dataset.lview; paintLinks(); return; }
  const ledit = e.target.closest('[data-linkedit]');
  if (ledit) { openEditor(ledit.dataset.linkedit, 'link'); return; }
  if (e.target.closest('[data-full]')) { state.editKind = 'full'; render(); return; }
  const open = e.target.closest('[data-open]');
  if (open) { openEditor(open.dataset.open, 'full'); return; }
  const fav = e.target.closest('[data-fav]');
  if (fav) { toggleFav(fav.dataset.fav); return; }
  if (e.target.closest('[data-back]')) { closeEditor(); return; }
  const who = e.target.closest('[data-who]');
  if (who) { who.classList.toggle('on'); who.setAttribute('aria-pressed', who.classList.contains('on') ? 'true' : 'false'); return; }
  if (e.target.closest('#pullBtn')) { pullPhotos(); return; }
  const pic = e.target.closest('[data-pic]');
  if (pic) {
    const url = state.pics[+pic.dataset.pic];
    if (url) showPhoto(url);
    document.querySelectorAll('#pics button').forEach((b, n) => b.classList.toggle('on', n === +pic.dataset.pic));
  }
});
document.getElementById('app').addEventListener('change', (e) => {
  if (e.target.id !== 'fFile' || !e.target.files || !e.target.files[0]) return;
  const note = document.getElementById('pullNote');
  readPhoto(e.target.files[0]).then(url => {
    showPhoto(url);
    if (note) note.textContent = 'photo ready.';
  }).catch(() => { if (note) note.textContent = 'that file needs to be a png.'; });
});
document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    if (state.tab === 'links') { state.lq = e.target.value; paintLinks(); }
    else { state.q = e.target.value; paintList(); }
    return;
  }
  if (e.target.id === 'fUrl') {
    const a = document.getElementById('visitLink');
    if (!a) return;
    const url = e.target.value.trim();
    if (https(url)) a.href = url;
    else a.removeAttribute('href');
  }
});
document.getElementById('app').addEventListener('change', (e) => {
  if (e.target.id === 'sec') { state.section = e.target.value; paintList(); }
  if (e.target.id === 'fSection') refreshGroups();
});
document.getElementById('app').addEventListener('submit', async (e) => {
  if (e.target.id === 'giftForm') saveGift(e);
  if (e.target.id === 'linkForm') saveLink(e);
  if (e.target.id === 'reqGate') {
    e.preventDefault();
    const err = document.getElementById('reqErr');
    const pw = (document.getElementById('reqPass').value || '');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(pw)));
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    if (hex !== DESK_HASH) { if (err) err.textContent = "that password didn't work."; return; }
    try { sessionStorage.setItem('gg26:deskSecret', String(pw)); } catch (ex) {}
    render();
  }
});
if (document.documentElement.classList.contains('desk')) showDesk();
</script>
</body>
</html>
